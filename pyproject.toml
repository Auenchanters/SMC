[project]
name = "agrisim"
version = "0.1.0"
description = "Soil-moisture survey simulator for a tomato-field rover (Layer A)."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.5.4",
    "scipy==1.18.1",
    "shapely==2.2.0",
    "pydantic==2.14.1",
    "pyyaml==6.0.3",
    "pykrige==1.7.3",
    "rerun-sdk==0.39.0",
    "gymnasium==1.3.0",
    "stable-baselines3==2.9.0",
    "sb3-contrib==2.9.0",
    "torch==2.14.1",
    "typer==0.27.3",
    "matplotlib==3.11.2",
]

[project.scripts]
agrisim = "agrisim.cli:app"

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.0",
    "mypy==2.4.0",
    "pip-licenses==5.5.5",
    "types-pyyaml==6.0.12.20260906",
    "scipy-stubs==1.18.1.1",
    "types-shapely==2.1.0.20260728",
]

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"

# Linux CI: CPU-only torch so proprietary nvidia-* wheels are never pulled in.
# Windows: the default PyPI torch wheel is already a CPU build.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]

[tool.mypy]
strict = true
files = ["src/agrisim"]

[[tool.mypy.overrides]]
module = ["pykrige.*"]  # PyKrige ships no type information
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
