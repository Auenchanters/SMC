# agribench v1 frozen world: a copy of configs/demo.yaml (2026-10-17). Never edit; see ../README.md.
# Demo configuration. Every number below is a PLACEHOLDER until calibrated with an agronomist
# or real probe data (context.md Section 9). Units: SI; soil moisture is VWC in m^3/m^3.

field:
  length_x: 30.0            # PLACEHOLDER: calibrate
  width_y: 20.0             # PLACEHOLDER: calibrate
  headland: 2.0             # PLACEHOLDER: calibrate
  row_spacing: 1.2          # PLACEHOLDER: calibrate
  plant_spacing: 0.5        # PLACEHOLDER: calibrate
  canopy_radius_min: 0.22   # PLACEHOLDER: calibrate
  canopy_radius_max: 0.30   # PLACEHOLDER: calibrate
  stem_keepout: 0.15        # PLACEHOLDER: calibrate
  plant_dropout_prob: 0.03  # PLACEHOLDER: calibrate

rover:
  width: 0.40               # PLACEHOLDER: calibrate
  length: 0.50              # PLACEHOLDER: calibrate
  max_speed: 0.5            # PLACEHOLDER: calibrate
  max_yaw_rate: 1.0         # PLACEHOLDER: calibrate
  safety_margin: 0.05       # PLACEHOLDER: calibrate

soil:
  grid_resolution: 0.25          # PLACEHOLDER: calibrate
  mean_vwc: 0.25                 # PLACEHOLDER: calibrate
  std_vwc: 0.05                  # PLACEHOLDER: calibrate
  corr_length_range: [3.0, 30.0] # PLACEHOLDER: calibrate
  covariance: exponential        # PLACEHOLDER: calibrate
  drip_stripe_amplitude: 0.03    # PLACEHOLDER: calibrate
  dry_patch_count: [1, 3]        # PLACEHOLDER: calibrate
  dry_patch_radius: [1.0, 3.0]   # PLACEHOLDER: calibrate
  dry_patch_depth: 0.08          # PLACEHOLDER: calibrate
  wet_patch_count: [0, 1]        # PLACEHOLDER: calibrate
  wet_patch_radius: [1.0, 3.0]   # PLACEHOLDER: calibrate
  wet_patch_height: 0.06         # PLACEHOLDER: calibrate
  vwc_clip: [0.05, 0.45]         # PLACEHOLDER: calibrate

probe:
  footprint_radius: 0.05    # PLACEHOLDER: calibrate
  noise_std: 0.02           # PLACEHOLDER: calibrate
  bias: 0.01                # PLACEHOLDER: calibrate
  resolution: 0.001         # PLACEHOLDER: calibrate
  failure_prob: 0.01        # PLACEHOLDER: calibrate
  insertion_time_s: 10.0    # PLACEHOLDER: calibrate

survey:
  probe_spacing: 2.0        # PLACEHOLDER: calibrate
  probe_budget: 60          # PLACEHOLDER: calibrate
  candidate_spacing: 1.0    # PLACEHOLDER: calibrate
  recheck_probes: 10        # fixed_plus_recheck only: probes kept back to recheck doubtful spots

mapping:
  method: ordinary_kriging
  variogram_model: exponential
  output_resolution: 0.5
  dry_threshold: 0.18       # PLACEHOLDER: calibrate (needs an agronomist, context.md Q4)
  min_readings: 5
