field:
  length_x: 30.0
  width_y: 20.0
  headland: 2.0
  row_spacing: 1.2
  plant_spacing: 0.5
  canopy_radius_min: 0.22
  canopy_radius_max: 0.3
  stem_keepout: 0.15
  plant_dropout_prob: 0.03
rover:
  width: 0.4
  length: 0.5
  max_speed: 0.5
  max_yaw_rate: 1.0
