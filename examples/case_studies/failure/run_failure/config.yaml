  mean_vwc: 0.25
  std_vwc: 0.05
  corr_length_range:
  - 3.0
  - 30.0
  covariance: exponential
  drip_stripe_amplitude: 0.03
  dry_patch_count:
  - 1
  - 3
  dry_patch_radius:
  - 1.0
  - 3.0
  dry_patch_depth: 0.08
  wet_patch_count:
  - 0
  - 1
  wet_patch_radius:
  - 1.0
  - 3.0
  wet_patch_height: 0.06
  vwc_clip:
  - 0.05
  - 0.45
probe:
  footprint_radius: 0.05
  noise_std: 0.02
  bias: 0.01
