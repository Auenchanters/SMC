<text class="ttitle" x="22" y="244">WHAT THE PROBE CAN AND CANNOT SEE</text>
<text class="td" x="22" y="248.4">The rover drives the lane centre and probes there, 600 mm from each drip line (blue dot).</text>
<text class="td" x="22" y="252.8">The wetted strip under a drip line (dashed) is about 150 mm to each side: the probe's</text>
<text class="td" x="22" y="257.2">± 60 mm rail does not reach it. A reach of 300 mm would cover half of it.</text>
<text class="td" x="22" y="261.6">Simulated with the new soil physics: a drip run during the survey raises the map error,</text>
<text class="td" x="22" y="266">because the water lands where lane-centre probes never go (docs/CALIBRATION.md).</text>
<text class="td" x="22" y="270.4">Open design question: a longer side reach, or a second probe on an arm.</text>
