<text class="td" x="282" y="170.4">1  Soil strength on the target farms (sets the push).</text>
<text class="td" x="282" y="174.8">2  How often each cleaning level is needed in local clay.</text>
<text class="td" x="282" y="179.2">3  The reference block for the bias check.</text>
<text class="td" x="282" y="183.6">4  Position along the row without RTK.</text>
<text class="td" x="282" y="188">5  Rocker stiffness and canopy clearance in a real lane.</text>
<text class="td" x="282" y="192.4">6  Side reach toward the drip line (this sheet).</text>
