<text class="ttitle" x="232" y="26">HOW THE ROCKER-DIFFERENTIAL WORKS</text>
<text class="td" x="232" y="30.4">A  Each side's two wheels hang from one rocker beam that pivots on the body.</text>
<text class="td" x="232" y="34.8">B  A differential bar across the front box links the beams: when one rises the</text>
<text class="td" x="232" y="39.2">   other falls, and the body takes the average of their angles.</text>
<text class="td" x="232" y="43.6">No springs: all four wheels stay loaded, and the body does not rise when the</text>
<text class="td" x="232" y="48">probe pushes down, so the push and the depth repeat.</text>
<line class="rule" x1="232" y1="65.6" x2="382" y2="65.6"/>
