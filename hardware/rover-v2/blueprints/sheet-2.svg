<text class="ttitle" x="232" y="186">MATERIALS</text>
<text class="td" x="232" y="190.4">Rocker beams: aluminium box section with welded axle drop brackets.</text>
<text class="td" x="232" y="194.8">Body: two 3 mm aluminium side plates joined by the front and rear cross boxes.</text>
<text class="td" x="232" y="199.2">Pivots: stainless stub shafts in sealed bearings. Links: rod ends.</text>
<text class="td" x="232" y="203.6">Wheels: 8.5 in pneumatic hub motors at about 60 kPa, sealant-filled.</text>
<text class="td" x="232" y="208">[A] = assumption or vendor-class figure, to confirm on the bench.</text>
