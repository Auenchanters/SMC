<line class="rule" x1="232" y1="29.6" x2="404" y2="29.6"/>
<text class="th" x="233" y="28">PROBE FORCE</text>
<text class="th" x="301" y="28">MOIST SOIL</text>
<text class="th" x="331" y="28">DRY CRUST</text>
<text class="th" x="361" y="28"></text>
<text class="td" x="233" y="32.6">Push needed [A]</text>
<text class="td" x="301" y="32.6">42 N</text>
<text class="td" x="331" y="32.6">106 N</text>
<text class="td" x="361" y="32.6">cone 1.2 / 3 MPa</text>
<text class="td" x="233" y="37.2">Push available, probe centred</text>
<text class="td" x="301" y="37.2">175 N</text>
<text class="td" x="331" y="37.2">175 N</text>
<text class="td" x="361" y="37.2">80% of lift-off</text>
<text class="td" x="233" y="41.8">Push available, 60 mm off centre</text>
<text class="td" x="301" y="41.8">129 N</text>
<text class="td" x="331" y="41.8">129 N</text>
<text class="td" x="361" y="41.8"></text>
<text class="td" x="233" y="46.4">Margin over dry crust, centred</text>
<text class="td" x="301" y="46.4"></text>
<text class="td" x="331" y="46.4">1.6 x</text>
<text class="td" x="361" y="46.4"></text>
<rect class="box" x="232" y="24" width="172" height="25.5"/>
<line class="rule" x1="232" y1="67.6" x2="404" y2="67.6"/>
<text class="th" x="233" y="66">t, s</text>
<text class="th" x="249" y="66">PROBE CYCLE (one reading)</text>
<text class="th" x="319" y="66">SPEED</text>
<text class="th" x="341" y="66"></text>
<text class="td" x="233" y="70.6">0 to 5.3</text>
<text class="td" x="249" y="70.6">Lower to the surface</text>
<text class="td" x="319" y="70.6">40 mm/s</text>
<text class="td" x="341" y="70.6"></text>
<text class="td" x="233" y="75.2">to 15.3</text>
<text class="td" x="249" y="75.2">Insert 60 mm</text>
<text class="td" x="319" y="75.2">6 mm/s</text>
<text class="td" x="341" y="75.2"></text>
<text class="td" x="233" y="79.8">to 17.3</text>
<text class="td" x="249" y="79.8">Read (VWC, temperature, EC)</text>
<text class="td" x="319" y="79.8">2 s</text>
<text class="td" x="341" y="79.8"></text>
<text class="td" x="233" y="84.4">to 24.0</text>
<text class="td" x="249" y="84.4">Retract through wiper plate and brushes</text>
<text class="td" x="319" y="84.4">40 mm/s</text>
<text class="td" x="341" y="84.4"></text>
<text class="td" x="233" y="89">to 27.0</text>
<text class="td" x="249" y="89">Air knife</text>
<text class="td" x="319" y="89">3 s</text>
<text class="td" x="341" y="89"></text>
<text class="td" x="233" y="93.6">to 28.0</text>
<text class="td" x="249" y="93.6">Air check: reads clean-air baseline</text>
<text class="td" x="319" y="93.6">1 s</text>
<text class="td" x="341" y="93.6">within 0.02</text>
<text class="td" x="233" y="98.2">+ 10</text>
<text class="td" x="249" y="98.2">Wet clean when the air check fails twice</text>
<text class="td" x="319" y="98.2">2 mL</text>
<text class="td" x="341" y="98.2">about 10% of cycles [A]</text>
<rect class="box" x="232" y="62" width="172" height="39.3"/>
<line class="rule" x1="232" y1="119.6" x2="404" y2="119.6"/>
<text class="th" x="233" y="118">LEVEL</text>
<text class="th" x="245" y="118">WHEN</text>
<text class="th" x="277" y="118">CLEANING, NO PERSON NEEDED</text>
<text class="td" x="233" y="122.6">0</text>
<text class="td" x="245" y="122.6">every cycle</text>
<text class="td" x="277" y="122.6">PU wiper plate with three rod slots, then two strip brushes</text>
<text class="td" x="233" y="127.2">1</text>
<text class="td" x="245" y="127.2">every cycle</text>
<text class="td" x="277" y="127.2">3 s air knife, then the air check</text>
<text class="td" x="233" y="131.8">2</text>
<text class="td" x="245" y="131.8">check fails</text>
<text class="td" x="277" y="131.8">stroke through the wipers again, blast, check</text>
<text class="td" x="233" y="136.4">3</text>
<text class="td" x="245" y="136.4">still failing</text>
<text class="td" x="277" y="136.4">1 s water spray, 8 s of air, check</text>
<text class="td" x="233" y="141">4</text>
<text class="td" x="245" y="141">after 2 wet cleans</text>
<text class="td" x="277" y="141">reading marked invalid; survey goes on; rover rechecks later</text>
<text class="td" x="233" y="145.6">5</text>
<text class="td" x="245" y="145.6">at the dock</text>
<text class="td" x="277" y="145.6">wash cup with brush, rinse, dry; reference block within 0.015</text>
<rect class="box" x="232" y="114" width="172" height="34.7"/>
<text class="ttitle" x="232" y="166">DROP-IN MODULE</text>
<text class="td" x="232" y="170.4">Two sideways rails, a sled, a belt-driven linear axis behind a bellows with its</text>
<text class="td" x="232" y="174.8">stepper beside it, the cleaning station hanging under the sled, and the probe.</text>
<text class="td" x="232" y="179.2">Held by two thumb screws, one M12 connector and one push-fit air/water line.</text>
<text class="td" x="232" y="183.6">The rail shifts the probe 5 cm to step round a stone, without driving.</text>
<text class="td" x="232" y="188">Probe: 3-rod stainless FDR, RS485, galvanically isolated from the rover.</text>
<text class="td" x="232" y="192.4">Phantom lines: full stroke on level ground.</text>
